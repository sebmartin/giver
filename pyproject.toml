[project]
name = "giver"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6.0.3",
]

[project.scripts]
giver = "giver.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/giver"]
